# Hydrophone Verification App Configuration
# 
# This file provides default settings. Most options can also be set via CLI or the in-app UI.
# If a data path is null, the user will be prompted to select it via the folder browser.

data:
  mode: label  # Initial mode: label, verify, or explore
  
  # Folder names to search for (in order of priority)
  spectrogram_folder_names:
    - spectrograms
    - onc_spectrograms
    - mat_files
  audio_folder_names:
    - audio
  
  label:
    folder: null           # Path to MAT/NPY spectrograms (select in app if null)
    audio_folder: null     # Path to audio files (optional)
    output_file: null      # Path for labels.json output
  
  verify:
    dashboard_root: null   # Root directory for DATE/DEVICE hierarchy
    date: null             # Specific date folder to load (or select in app)
    hydrophone: null       # Specific device folder to load (or select in app)

display:
  items_per_page: 25
  y_axis_scale: linear   # linear or log
  colormap: default      # default or hydrophone
  # Full source matrix rendered as a losslessly compressed image inside Plotly axes.
  modal_render_mode: full_resolution_image

cache:
  max_size: 75
  modal_prefetch_enabled: true

audio:
  # direct: serve the original source file; mp3_cached is an explicit fallback for browser seeking.
  transport: direct
  mp3_bitrate: 128k
  cache_dir: /tmp/hydrophone_audio_transport
  cache_max_age: 300
  stale_while_revalidate: 60
  stale_if_error: 86400
  # Keep the old filename route alive for compatibility, but it now redirects to the tokenized audio URL.
  legacy_filename_route: true

spectrogram_render:
  source: existing          # existing or audio_generated
  win_dur_s: 1.0            # window duration in seconds (audio_generated mode)
  overlap: 0.5              # overlap ratio [0, 0.99] (audio_generated mode)
  freq_min_hz: 5.0          # min displayed frequency for generated spectrograms
  freq_max_hz: 100.0        # max displayed frequency for generated spectrograms
  presets:
    - id: recommended
      label: Recommended
      scope: item
      metadata_key: recommended_spectrogram
      win_dur_s: 1.0
      overlap: 0.9
      freq_min_hz: 5.0
      freq_max_hz: 125.0
    - id: low
      label: Low | 5-125 Hz
      win_dur_s: 1.0
      overlap: 0.9
      freq_min_hz: 5.0
      freq_max_hz: 125.0
    - id: mid
      label: Mid | 100-2,000 Hz
      win_dur_s: 0.25
      overlap: 0.9
      freq_min_hz: 100.0
      freq_max_hz: 2000.0
    - id: high
      label: High | 500-8,000 Hz
      win_dur_s: 0.1
      overlap: 0.9
      freq_min_hz: 500.0
      freq_max_hz: 8000.0

bounding_box_tags:
  options_file: config/bounding_box_tags.yaml
  active_set: fin_whale
